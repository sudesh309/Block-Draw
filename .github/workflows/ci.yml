name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit runtime dependencies
        # Reports known vulnerabilities in what ships (fflate); it does not fail the build on its own.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (includes type check)
        run: npm run build
      - name: Editor UI tests (Chrome)
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" npm run test:ui
