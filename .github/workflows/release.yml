name: Release

# Publishes a GitHub release with exactly the files Obsidian installs: main.js, manifest.json and
# styles.css (nothing else, so the community directory's scanner doesn't flag extra release
# assets), signed with GitHub artifact attestations, using the matching section of CHANGELOG.md as
# notes. Either push a tag that matches the version in manifest.json (e.g. 0.1.0, without a "v"),
# or run this workflow from the Actions tab: it then tags the selected commit with that version.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check version and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const manifest = require("./manifest.json");
            const versions = require("./versions.json");
            const pkg = require("./package.json");
            const fail = (msg) => { console.log(`::error::${msg}`); process.exit(1); };
            if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== manifest.version)
              fail(`Tag ${process.env.GITHUB_REF_NAME} does not match manifest.json version ${manifest.version}`);
            if (pkg.version !== manifest.version) fail(`package.json version ${pkg.version} does not match manifest.json`);
            if (versions[manifest.version] !== manifest.minAppVersion) fail(`versions.json needs "${manifest.version}": "${manifest.minAppVersion}"`);
          '
          version="$(node -p 'require("./manifest.json").version')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "::error::Release $version already exists. Bump the version with npm version first."
            exit 1
          fi
          awk -v v="$version" '/^## /{p = ($2 == v); n = 0; next} p && (n || NF) {n = 1; print}' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" --title "$VERSION" --target "$GITHUB_SHA" --notes-file release-notes.md \
            main.js manifest.json styles.css
