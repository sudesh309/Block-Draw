name: Release

# Push a tag that matches the version in manifest.json (e.g. 0.1.0, without a "v") to publish a
# GitHub release with the files Obsidian installs: main.js, manifest.json and styles.css, plus a
# zip of the plugin folder. The release notes are the matching section of CHANGELOG.md.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check version and release notes
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME;
            const manifest = require("./manifest.json");
            const versions = require("./versions.json");
            const pkg = require("./package.json");
            const fail = (msg) => { console.log(`::error::${msg}`); process.exit(1); };
            if (tag !== manifest.version) fail(`Tag ${tag} does not match manifest.json version ${manifest.version}`);
            if (pkg.version !== manifest.version) fail(`package.json version ${pkg.version} does not match manifest.json`);
            if (versions[manifest.version] !== manifest.minAppVersion) fail(`versions.json needs "${manifest.version}": "${manifest.minAppVersion}"`);
          '
          awk -v v="$GITHUB_REF_NAME" '/^## /{p = ($2 == v); n = 0; next} p && (n || NF) {n = 1; print}' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          mkdir -p dist/block-draw
          cp main.js manifest.json styles.css dist/block-draw/
          (cd dist && zip -r "../block-draw-$tag.zip" block-draw)
          gh release create "$tag" --title "$tag" --notes-file release-notes.md \
            main.js manifest.json styles.css "block-draw-$tag.zip"
